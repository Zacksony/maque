syntax = "proto3";

package maque.majsoul;
option csharp_namespace = "Maque.Majsoul.Protocol";

// Only the stable fields needed to import ordinary Mahjong Soul game records
// are declared here. Protobuf preserves compatibility by ignoring newer fields.

message Wrapper {
  string name = 1;
  bytes data = 2;
}

message Error {
  uint32 code = 1;
  repeated uint32 u32_params = 2;
  repeated string str_params = 3;
  string json_param = 4;
}

message ReqCommon {}

message ResCommon {
  Error error = 1;
}

message ClientDeviceInfo {
  string platform = 1;
  string hardware = 2;
  string os = 3;
  string os_version = 4;
  bool is_browser = 5;
  string software = 6;
  string sale_platform = 7;
  string hardware_vendor = 8;
  string model_number = 9;
  uint32 screen_width = 10;
  uint32 screen_height = 11;
  string user_agent = 12;
  uint32 screen_type = 13;
}

message ClientVersionInfo {
  string resource = 1;
  string package = 2;
}

message ReqLogin {
  string account = 1;
  string password = 2;
  bool reconnect = 3;
  ClientDeviceInfo device = 4;
  string random_key = 5;
  ClientVersionInfo client_version = 6;
  bool gen_access_token = 7;
  repeated uint32 currency_platforms = 8;
  uint32 type = 9;
  uint32 version = 10;
  string client_version_string = 11;
  string tag = 12;
}

message ResLogin {
  Error error = 1;
  uint32 account_id = 2;
  string access_token = 6;
}

message ReqLoginBeat {
  string contract = 1;
}

message ReqGameRecord {
  string game_uuid = 1;
  string client_version_string = 2;
}

message ResGameRecord {
  Error error = 1;
  RecordGame head = 3;
  bytes data = 4;
  string data_url = 5;
}

message ReqRequestConnection {
  uint32 type = 2;
  string route_id = 3;
  uint64 timestamp = 4;
  string platform = 6;
}

message ResRequestConnection {
  Error error = 1;
  uint64 timestamp = 2;
  uint32 result = 3;
}

message RecordGame {
  string uuid = 1;
  uint32 start_time = 2;
  uint32 end_time = 3;
  GameConfig config = 5;
  repeated AccountInfo accounts = 11;
  GameEndResult result = 12;
  repeated AccountInfo robots = 13;
  uint32 standard_rule = 14;
}

message AccountInfo {
  uint32 account_id = 1;
  uint32 seat = 2;
  string nickname = 3;
  uint32 avatar_id = 4;
  uint32 title = 6;
  AccountLevel level = 7;
  AccountLevel level3 = 8;
  uint32 avatar_frame = 9;
  uint32 verified = 10;
}

message AccountLevel {
  uint32 id = 1;
  uint32 score = 2;
}

message GameConfig {
  uint32 category = 1;
  GameMode mode = 2;
  GameMetaData meta = 3;
}

message GameMode {
  uint32 mode = 1;
  bool ai = 4;
  string extendinfo = 5;
  GameDetailRule detail_rule = 6;
}

message GameMetaData {
  uint32 room_id = 1;
  uint32 mode_id = 2;
  uint32 contest_uid = 3;
}

message GameDetailRule {
  uint32 time_fixed = 1;
  uint32 time_add = 2;
  uint32 dora_count = 3;
  uint32 shiduan = 4;
  uint32 init_point = 5;
  uint32 fandian = 6;
  bool can_jifei = 7;
  uint32 liqibang_value = 9;
  uint32 changbang_value = 10;
  bool have_biao_dora = 16;
  bool have_li_dora = 19;
  bool have_yifa = 31;
  bool have_nanruxiru = 32;
}

message GameEndResult {
  repeated PlayerResult players = 1;
}

message PlayerResult {
  uint32 seat = 1;
  int32 total_point = 2;
  int32 part_point_1 = 3;
  int32 part_point_2 = 4;
  int32 grading_score = 5;
  int32 gold = 6;
}

message GameDetailRecords {
  repeated bytes records = 1;
  uint32 version = 2;
  repeated GameAction actions = 3;
  bytes bar = 4;
}

message GameAction {
  uint32 passed = 1;
  uint32 type = 2;
  bytes result = 3;
  uint32 game_event = 6;
}

message LiQiSuccess {
  uint32 seat = 1;
  int32 score = 2;
  uint32 liqibang = 3;
  bool failed = 4;
  uint32 liqi_type = 5;
}

message RecordNewRound {
  uint32 chang = 1;
  uint32 ju = 2;
  uint32 ben = 3;
  string dora = 4;
  repeated int32 scores = 5;
  uint32 liqibang = 6;
  repeated string tiles0 = 7;
  repeated string tiles1 = 8;
  repeated string tiles2 = 9;
  repeated string tiles3 = 10;
  string md5 = 13;
  string paishan = 14;
  uint32 left_tile_count = 15;
  repeated string doras = 16;
  uint32 ju_count = 20;
}

message RecordDealTile {
  uint32 seat = 1;
  string tile = 2;
  uint32 left_tile_count = 3;
  LiQiSuccess liqi = 5;
  repeated string doras = 6;
  uint32 tile_state = 9;
  uint32 tile_index = 12;
}

message RecordDiscardTile {
  uint32 seat = 1;
  string tile = 2;
  bool is_liqi = 3;
  bool moqie = 5;
  repeated string doras = 8;
  bool is_wliqi = 9;
  uint32 tile_state = 11;
}

message RecordChiPengGang {
  uint32 seat = 1;
  uint32 type = 2;
  repeated string tiles = 3;
  repeated uint32 froms = 4;
  LiQiSuccess liqi = 5;
  repeated uint32 tile_states = 9;
  repeated int32 scores = 11;
  uint32 liqibang = 12;
}

message RecordAnGangAddGang {
  uint32 seat = 1;
  uint32 type = 2;
  string tiles = 3;
  repeated string doras = 6;
}

message RecordBaBei {
  uint32 seat = 1;
  repeated string doras = 6;
  bool moqie = 8;
  uint32 tile_state = 10;
}

message FanInfo {
  string name = 1;
  uint32 val = 2;
  uint32 id = 3;
}

message HuleInfo {
  repeated string hand = 1;
  repeated string ming = 2;
  string hu_tile = 3;
  uint32 seat = 4;
  bool zimo = 5;
  bool qinjia = 6;
  bool liqi = 7;
  repeated string doras = 8;
  repeated string li_doras = 9;
  bool yiman = 10;
  uint32 count = 11;
  repeated FanInfo fans = 12;
  uint32 fu = 13;
  string title = 14;
  uint32 point_rong = 15;
  uint32 point_zimo_qin = 16;
  uint32 point_zimo_xian = 17;
  uint32 title_id = 18;
  uint32 point_sum = 19;
  uint32 dadian = 20;
  uint32 baopai = 21;
  repeated uint32 baopai_seats = 22;
}

message GameEnd {
  repeated int32 scores = 1;
}

message RecordHule {
  repeated HuleInfo hules = 1;
  repeated int32 old_scores = 2;
  repeated int32 delta_scores = 3;
  repeated int32 scores = 5;
  GameEnd gameend = 6;
  repeated string doras = 7;
  int32 baopai = 9;
}

message NoTilePlayerInfo {
  bool tingpai = 3;
  repeated string hand = 4;
  bool already_hule = 6;
}

message NoTileScoreInfo {
  uint32 seat = 1;
  repeated int32 old_scores = 2;
  repeated int32 delta_scores = 3;
  repeated string hand = 4;
  repeated string ming = 5;
  repeated string doras = 6;
  uint32 score = 7;
}

message RecordNoTile {
  bool liujumanguan = 1;
  repeated NoTilePlayerInfo players = 2;
  repeated NoTileScoreInfo scores = 3;
  bool gameend = 4;
}

message RecordLiuJu {
  uint32 type = 1;
  GameEnd gameend = 2;
  uint32 seat = 3;
  repeated string tiles = 4;
  LiQiSuccess liqi = 5;
  repeated string allplayertiles = 6;
}
